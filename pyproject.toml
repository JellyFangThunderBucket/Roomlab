[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roomlab"
version = "1.0.0"
description = "A small, precise, self-hosted room planner"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
roomlab = "roomlab.cli:main"

[tool.setuptools.package-data]
roomlab = ["static/*", "data/*.json"]

