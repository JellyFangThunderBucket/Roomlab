<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROOMLAB</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><header><b>ROOMLAB</b><input id="projectName" value="9x12 Bedroom" aria-label="Project name"><button id="newRoom">Room</button><button id="save">Save</button><button id="load">Projects</button><button id="layouts">Generate layout</button><button id="exportJson">Export JSON</button><button id="exportPng">Export PNG</button><span class="spacer"></span><label>Units <select id="units"><option value="feet">ft/in</option><option value="inches">inches</option><option value="cm">cm</option></select></label></header>
<main><aside id="library"><h2>FURNITURE</h2><input id="search" placeholder="Filter catalog"><div id="catalog"></div><button id="custom">+ Add custom item</button><hr><h2>FEATURES</h2><div class="featureBtns"><button data-feature="door">Door</button><button data-feature="window">Window</button><button data-feature="closet">Closet</button><button data-feature="opening">Opening</button><button data-feature="radiator">Radiator</button><button data-feature="fireplace">Fireplace</button><button data-feature="column">Column</button></div></aside>
<section id="workspace"><div id="tools"><label>Grid <select id="grid"><option>1</option><option selected>3</option><option>6</option><option>12</option></select>”</label><label><input type="checkbox" id="snap" checked> Snap</label><label><input type="checkbox" id="clearances"> Clearances</label><button id="measure">Measure</button><button id="zoomFit">Fit</button><span id="status">Ready</span></div><canvas id="canvas"></canvas></section>
<aside id="inspector"><section><h2>PROPERTIES</h2><div id="properties"><p>Select a furniture item.</p></div></section><section><h2>ROOM ANALYSIS</h2><div id="analysis"></div></section></aside></main>
<dialog id="roomDialog"><form method="dialog"><h2>Room dimensions</h2><label>Width <input id="roomWidth" value="9 ft" required></label><label>Length <input id="roomLength" value="12 ft" required></label><div class="presets"></div><menu><button value="cancel">Cancel</button><button id="applyRoom" value="default">Apply</button></menu></form></dialog>
<dialog id="projectDialog"><h2>Projects</h2><div id="projectList"></div><button onclick="this.closest('dialog').close()">Close</button></dialog>
<dialog id="layoutDialog"><h2>Layout suggestions</h2><p class="hint">Planning heuristics, not building-code determinations.</p><div id="layoutList"></div><button onclick="this.closest('dialog').close()">Close</button></dialog>
<dialog id="customDialog"><form method="dialog"><h2>Custom furniture</h2><label>Name <input id="customName" required value="Custom Item"></label><label>Width <input id="customWidth" required value="24 in"></label><label>Depth <input id="customDepth" required value="24 in"></label><label>Category <select id="customCategory"><option>Custom</option><option>Bedroom</option><option>Seating</option><option>Tables</option><option>Storage</option><option>Office</option><option>Dining</option></select></label><menu><button value="cancel">Cancel</button><button id="addCustom" value="default">Save to library</button></menu></form></dialog>
<script src="/static/app.js"></script></body></html>
